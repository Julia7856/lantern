name: demo

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps / зависимости
        run: pip install kyber-py cryptography
      - name: Run session demo / запуск демо
        run: python session.py
