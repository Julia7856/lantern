name: demo

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps / зависимости
        run: pip install kyber-py cryptography
      - name: Run all modules / запуск всех модулей
        run: |
          python session.py
          python crypto/mlkem_exchange.py
          python crypto/hybrid_kem.py
          python identity/did_key.py
          python crypto/ratchet.py
