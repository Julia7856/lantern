<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern 🏮</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.6/full/pyodide.js"></script>
<style>
  body { background:#0d1117; color:#e6edf3; font-family:monospace; margin:0; padding:16px; }
  h1 { font-size:20px; }
  #log { white-space:pre-wrap; background:#161b22; padding:12px; border-radius:8px; min-height:200px; }
  button { background:#238636; color:#fff; border:0; padding:10px 16px; border-radius:6px; font-size:16px; }
</style>
</head>
<body>
<h1>🏮 Lantern — live demo</h1>
<p id="status">Loading Python (WASM)… / Загружаю Python (WASM)…</p>
<button id="run" disabled>▶ Run session / Запустить сессию</button>
<div id="log"></div>
<script>
const BASE = "https://raw.githubusercontent.com/Julia7856/lantern/main/";
const FILES = ["session.py", "crypto/ratchet.py", "crypto/session_ratchet.py",
               "crypto/mlkem_exchange.py", "crypto/hybrid_kem.py", "identity/did_key.py"];
const status = document.getElementById("status");
const log = document.getElementById("log");

function showErr(e) {
  status.textContent = "❌ ERROR: " + (e.message || JSON.stringify(e));
  log.textContent = e.stack || String(e);
}

async function main() {
  try {
    const pyodide = await loadPyodide();
    window.pyodide = pyodide;
    status.textContent = "Installing cryptography… / Ставлю cryptography…";
    await pyodide.loadPackage("cryptography");
    status.textContent = "Loading micropip… / Грузлю micropip…";
    await pyodide.loadPackage("micropip");
    status.textContent = "Installing kyber-py… / Ставлю kyber-py…";
    try {
      await pyodide.runPythonAsync(`import micropip; await micropip.install("kyber-py")`);
    } catch (e1) {
      status.textContent = "Retrying kyber-py 1.0.1… / Пробую kyber-py 1.0.1…";
      await pyodide.runPythonAsync(`import micropip; await micropip.install("kyber-py==1.0.1")`);
    }
    for (const f of FILES) {
      status.textContent = "Fetching " + f + "… / Качаю " + f + "…";
      const code = await (await fetch(BASE + f)).text();
      if (f.includes("/")) pyodide.FS.mkdirTree(f.split("/")[0]);
      pyodide.FS.writeFile(f, code);
    }
    status.textContent = "Ready ✅ / Готово ✅";
    const btn = document.getElementById("run");
    btn.disabled = false;
    btn.onclick = run;
  } catch (e) {
    showErr(e);
  }
}

async function run() {
  log.textContent = "";
  window.pyodide.setStdout({ batched: (t) => { log.textContent += t + "\n"; } });
  try {
    await window.pyodide.runPythonAsync(
      `import sys, runpy; sys.path.insert(0, "."); runpy.run_path("session.py", run_name="__main__")`
    );
  } catch (e) {
    showErr(e);
  }
}
main();
</script>
</body>
</html>
