<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern 🏮 — Live Chat</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.6/full/pyodide.js"></script>
<style>
  body { background:#0d1117; color:#e6edf3; font-family:monospace; margin:0; padding:16px; }
  h1 { font-size:20px; }
  #chat { background:#161b22; padding:12px; border-radius:8px; min-height:300px; max-height:400px; overflow-y:auto; margin-bottom:12px; }
  .alice { color:#79c0ff; }
  .bob { color:#ffa657; }
  .wire { color:#8b949e; font-size:12px; }
  input { width:calc(100% - 90px); padding:8px; background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:6px; font-family:monospace; }
  button { background:#238636; color:#fff; border:0; padding:10px 16px; border-radius:6px; font-size:14px; }
  #status { color:#8b949e; font-size:14px; }
</style>
</head>
<body>
<h1>🏮 Lantern — Live Chat</h1>
<div id="status">Loading… / Загрузка…</div>
<div id="chat"></div>
<input id="msg" placeholder="Write as Alice / Пиши за Алису…" disabled>
<button id="send" disabled>Send / Отправить</button>
<script>
const BASE = "https://raw.githubusercontent.com/Julia7856/lantern/main/";
const FILES = ["session.py", "crypto/ratchet.py", "crypto/session_ratchet.py",
               "crypto/mlkem_exchange.py", "crypto/hybrid_kem.py", "identity/did_key.py"];
const status = document.getElementById("status");
const chat = document.getElementById("chat");

function addLine(cls, text) {
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function main() {
  try {
    status.textContent = "⏳ loadPyodide";
    const pyodide = await loadPyodide();
    window.pyodide = pyodide;
    status.textContent = "⏳ load cryptography";
    await pyodide.loadPackage("cryptography");
    status.textContent = "⏳ load micropip";
    await pyodide.loadPackage("micropip");
    status.textContent = "⏳ install kyber-py";
    try {
      await pyodide.runPythonAsync(`import micropip; await micropip.install("kyber-py")`);
    } catch (e) {
      status.textContent = "⏳ retry kyber-py==1.0.1";
      await pyodide.runPythonAsync(`import micropip; await micropip.install("kyber-py==1.0.1")`);
    }
    for (const f of FILES) {
      status.textContent = "⏳ fetch " + f;
      const code = await (await fetch(BASE + f)).text();
      pyodide.globals.set("fpath", f);
      pyodide.globals.set("fcode", code);
      await pyodide.runPythonAsync(`
import os
d = os.path.dirname(fpath)
if d:
    os.makedirs(d, exist_ok=True)
with open(fpath, "w", encoding="utf-8") as fh:
    fh.write(fcode)
`);
    }
    status.textContent = "⏳ init sessions";
    await pyodide.runPythonAsync(`
import sys
sys.path.insert(0, ".")
from session import make_session
alice = make_session("alice_seed")
bob = make_session("bob_seed")
`);
    status.textContent = "✅ Ready / Готово";
    const msg = document.getElementById("msg");
    const send = document.getElementById("send");
    msg.disabled = false;
    send.disabled = false;
    send.onclick = sendMessage;
    msg.onkeypress = (e) => { if (e.key === "Enter") sendMessage(); };
  } catch (e) {
    status.textContent = "❌ " + (e.message || JSON.stringify(e));
  }
}

async function sendMessage() {
  const msg = document.getElementById("msg");
  const text = msg.value.trim();
  if (!text) return;
  msg.value = "";
  addLine("alice", "📤 Alice: " + text);
  
  const pyodide = window.pyodide;
  pyodide.globals.set("plaintext", text);
  
  try {
    await pyodide.runPythonAsync(`
from session import alice, bob
ct, sig = alice.encrypt(plaintext.encode("utf-8"))
`);
    const ct = pyodide.globals.get("ct");
    addLine("wire", "🔒 Wire: " + ct.toJs().slice(0, 32) + "...");
    
    await pyodide.runPythonAsync(`
pt = bob.decrypt(ct, sig)
`);
    const pt = pyodide.globals.get("pt");
    addLine("bob", "📥 Bob: " + pt.toJs().decode("utf-8"));
    
    addLine("wire", "⚙️ Keys rotated / Ключи ротированы");
    
    setTimeout(() => {
      addLine("bob", "📤 Bob: " + ["Got it!", "Understood", "👍", "Roger"][Math.floor(Math.random() * 4)]);
      addLine("wire", "⚙️ Keys rotated / Ключи ротированы");
    }, 500);
  } catch (e) {
    addLine("wire", "❌ Error: " + (e.message || JSON.stringify(e)));
  }
}

main();
</script>
</body>
</html>
