<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern 🏮 — Live Chat</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.6/full/pyodide.js"></script>
<style>
  body { background:#0d1117; color:#e6edf3; font-family:monospace; margin:0; padding:16px; }
  h1 { font-size:20px; }
  #chat { background:#161b22; padding:12px; border-radius:8px; min-height:200px; max-height:35vh; overflow-y:auto; margin-bottom:12px; }
  .alice { color:#79c0ff; margin-top:6px; }
  .bob { color:#ffa657; margin-top:6px; }
  .wire { color:#8b949e; font-size:12px; }
  #row { display:flex; gap:8px; }
  #msg { flex:1; padding:10px; background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:6px; font-family:monospace; font-size:15px; }
  button { background:#238636; color:#fff; border:0; padding:10px 16px; border-radius:6px; font-size:14px; }
  #tools button { background:#6e7681; margin-right:8px; margin-bottom:8px; }
  #status { color:#8b949e; font-size:14px; margin-bottom:8px; }
  #out { display:none; background:#161b22; padding:8px; border-radius:8px; font-size:11px; max-height:30vh; overflow:auto; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<h1>🏮 Lantern — Live Chat</h1>
<div id="status">Loading… / Загрузка…</div>
<div id="tools">
<button id="setup" disabled>🔐 Author setup</button>
<button id="sign" disabled>🔏 Sign modules</button>
</div>
<pre id="out"></pre>
<div id="chat"></div>
<div id="row">
<input id="msg" placeholder="Write as Alice / Пиши за Алису…" disabled>
<button id="send" disabled>Send ➤</button>
</div>
<script>
const BASE = "https://raw.githubusercontent.com/Julia7856/lantern/main/";
const FILES = ["session.py", "crypto/ratchet.py", "crypto/session_ratchet.py",
               "crypto/mlkem_exchange.py", "crypto/hybrid_kem.py", "identity/did_key.py"];
const status = document.getElementById("status");
const chat = document.getElementById("chat");
const out = document.getElementById("out");
function say(t) { status.textContent = t; }
function addLine(cls, text) {
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function main() {
  try {
    say("⏳ loadPyodide");
    const pyodide = await loadPyodide();
    window.pyodide = pyodide;
    say("⏳ load cryptography");
    await pyodide.loadPackage("cryptography");
    say("⏳ load micropip");
    await pyodide.loadPackage("micropip");
    say("⏳ install kyber-py");
    try {
      await pyodide.runPythonAsync(`import micropip; await micropip.install("kyber-py")`);
    } catch (e) {
      say("⏳ retry kyber-py==1.0.1");
      await pyodide.runPythonAsync(`import micropip; await micropip.install("kyber-py==1.0.1")`);
    }
    say("⏳ fetch signatures");
    let sigdata = null;
    try { sigdata = await (await fetch(BASE + "docs/signatures.json")).json(); } catch (e) {}
    for (const f of FILES) {
      say("⏳ fetch " + f);
      const code = await (await fetch(BASE + f)).text();
      if (sigdata && sigdata.pub && sigdata.sig && sigdata.sig[f]) {
        pyodide.globals.set("fcode2", code);
        pyodide.globals.set("fsig", sigdata.sig[f]);
        pyodide.globals.set("fpub", sigdata.pub);
        const ok = await pyodide.runPythonAsync(`
from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
try:
    Ed25519PublicKey.from_public_key(bytes.fromhex(fpub)).verify(bytes.fromhex(fsig), fcode2.encode())
    True
except Exception:
    False
`);
        if (!ok) { say("❌ SIGNATURE MISMATCH: " + f); return; }
        addLine("wire", "🔏 " + f + " — signature OK / подпись верна");
      } else {
        addLine("wire", "⚠️ " + f + " — unsigned / без подписи");
      }
      pyodide.globals.set("fpath", f);
      pyodide.globals.set("fcode", code);
      await pyodide.runPythonAsync(`
import os
d = os.path.dirname(fpath)
if d:
    os.makedirs(d, exist_ok=True)
with open(fpath, "w", encoding="utf-8") as fh:
    fh.write(fcode)
`);
    }
    say("⏳ init ratchet session");
    await pyodide.runPythonAsync(`
import sys, json
sys.path.insert(0, ".")
from session import DoubleRatchet, create_did, hybrid_session_key, encrypt, decrypt
alice_id = create_did()
bob_id = create_did()
root = hybrid_session_key()
alice = DoubleRatchet("Alice")
bob = DoubleRatchet("Bob")
alice.root = root
bob.root = root
alice.init_as_sender(bob.public())
bob.init_as_receiver(alice.public())
a_pub = alice_id["private_key"].public_key()
b_pub = bob_id["private_key"].public_key()
msg_num = 0
`);
    say("✅ Ready / Готово — пиши за Алису!");
    const msg = document.getElementById("msg");
    const send = document.getElementById("send");
    msg.disabled = false;
    send.disabled = false;
    document.getElementById("setup").disabled = false;
    document.getElementById("sign").disabled = false;
    send.onclick = sendMessage;
    msg.onkeypress = (e) => { if (e.key === "Enter") sendMessage(); };
    document.getElementById("setup").onclick = authorSetup;
    document.getElementById("sign").onclick = signModules;
  } catch (e) {
    say("❌ " + (e.message || JSON.stringify(e)));
  }
}

async function authorSetup() {
  const py = window.pyodide;
  const res = await py.runPythonAsync(`
import os, json
from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
seed = os.urandom(32)
sk = Ed25519PrivateKey.from_private_bytes(seed)
pub = sk.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw).hex()
json.dumps({"priv": seed.hex(), "pub": pub})
`);
  const r = JSON.parse(res);
  out.style.display = "block";
  out.textContent = "🔐 PRIV seed — СОХРАНИ В ЗАМЕТКИ (никому!):\n" + r.priv +
    "\n\n📄 Создай файл docs/signatures.json с содержимым:\n" +
    JSON.stringify({pub: r.pub, sig: {}}, null, 2);
}

async function signModules() {
  const priv = prompt("Вставь PRIV seed из заметок:");
  if (!priv) return;
  const py = window.pyodide;
  py.globals.set("priv_hex", priv.trim());
  let sigs = {}; let pub = "";
  for (const f of FILES) {
    const code = await (await fetch(BASE + f)).text();
    py.globals.set("fcode2", code);
    const res = await py.runPythonAsync(`
import json
from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
seed = bytes.fromhex(priv_hex)
sk = Ed25519PrivateKey.from_private_bytes(seed)
pub = sk.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw).hex()
sig = sk.sign(fcode2.encode()).hex()
json.dumps({"pub": pub, "sig": sig})
`);
    const r = JSON.parse(res);
    pub = r.pub; sigs[f] = r.sig;
  }
  out.style.display = "block";
  out.textContent = "📄 Замени docs/signatures.json на это:\n" +
    JSON.stringify({pub: pub, sig: sigs}, null, 2);
}

async function sendMessage() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  const py = window.pyodide;
  py.globals.set("user_text", text);
  try {
    addLine("alice", "📤 Alice: " + text);
    const r1 = JSON.parse(await py.runPythonAsync(`
import json
if msg_num > 0:
    alice.dh_step(bob.public(), "send")
    bob.dh_step(alice.public(), "recv")
mk_s = alice.send_key()
env = encrypt(user_text.encode("utf-8"), mk_s, alice_id)
mk_r = bob.recv_key()
plain = decrypt(env, mk_r, a_pub)
msg_num += 1
json.dumps({"wire": env["ct"].hex()[:40], "key": mk_s.hex()[:16],
            "match": mk_s == mk_r, "plain": plain.decode("utf-8")})
`));
    addLine("wire", "🔒 wire: " + r1.wire + "… | 🔑 " + r1.key + "… | match: " + r1.match);
    addLine("bob", "📥 Bob расшифровал / decrypted: " + r1.plain + " ✅");

    const replies = ["Got it! / Принял!", "Loud and clear 📡 / Слышу отлично!", "👍", "Keys rotating 🔐 / Ключи крутятся!"];
    const reply = replies[Math.floor(Math.random() * replies.length)];
    py.globals.set("reply_text", reply);
    const r2 = JSON.parse(await py.runPythonAsync(`
import json
bob.dh_step(alice.public(), "send")
alice.dh_step(bob.public(), "recv")
mk_s = bob.send_key()
env = encrypt(reply_text.encode("utf-8"), mk_s, bob_id)
mk_r = alice.recv_key()
plain = decrypt(env, mk_r, b_pub)
json.dumps({"wire": env["ct"].hex()[:40], "key": mk_s.hex()[:16],
            "match": mk_s == mk_r, "plain": plain.decode("utf-8")})
`));
    addLine("bob", "📤 Bob: " + reply);
    addLine("wire", "🔒 wire: " + r2.wire + "… | 🔑 " + r2.key + "… | match: " + r2.match);
    addLine("alice", "📥 Alice расшифровала / decrypted: " + r2.plain + " ✅");
  } catch (e) {
    addLine("wire", "❌ " + (e.message || JSON.stringify(e)));
  }
}
main();
</script>
</body>
</html>
